name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Tests (data, leakage, model quality)
        run: pytest -v

      - name: Train and evaluate all models
        run: python train.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t failure-predictor .

      - name: Tests inside the container
        run: docker run --rm failure-predictor pytest -q

      - name: Train and evaluate inside the container
        run: |
          mkdir -p docker-results && chmod 777 docker-results
          docker run --rm -v "$PWD/docker-results:/app/results" failure-predictor
          test -f docker-results/metrics.json && cat docker-results/metrics.md
