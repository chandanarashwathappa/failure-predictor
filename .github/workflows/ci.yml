name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Tests (data, leakage, model quality)
        run: pytest -v

      - name: Train and evaluate all models
        run: python train.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
